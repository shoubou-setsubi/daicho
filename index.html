<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>消防用設備 写真台帳作成 Pro</title>

  <style>
    :root {
      --primary: #2563eb;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 12px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 12px 28px -4px rgba(0, 0, 0, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 140px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* 上部ヘッダー（PC右寄せ・圧迫感軽減） */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      padding: 10px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .nav-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      margin-right: auto;
    }
    .nav-title span {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      background-color: #334155;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
      min-height: 36px;
      text-align: center;
      white-space: nowrap;
    }
    .btn:active { transform: translateY(1px); opacity: 0.9; }
    .btn-emerald { background: linear-gradient(135deg, #059669 0%, #10b981 100%); border: none; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); }
    .btn-amber { background-color: #d97706; border: none; }
    .btn-rose { background-color: #e11d48; border: none; }
    .btn-indigo { background-color: #4f46e5; border: none; }
    .btn-sky { background-color: #0284c7; border: none; }
    .btn-toggle-active { background-color: #059669; border-color: #34d399; }

    /* ドロップダウン (PC) */
    .project-dropdown-wrapper { position: relative; }
    .project-menu-popup {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 6px;
      width: 280px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: var(--radius-md);
      padding: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      z-index: 150;
      flex-direction: column;
      gap: 10px;
    }
    .project-menu-popup.is-open { display: flex; }
    .project-menu-popup label { font-size: 11px; font-weight: 700; color: #94a3b8; }
    .project-menu-popup select {
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      min-height: 38px;
    }
    .project-menu-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid #334155;
      padding-top: 8px;
    }
    .project-menu-actions .btn { width: 100%; justify-content: flex-start; }

    /* コンテナ */
    .container { max-width: 900px; margin: 16px auto; padding: 0 12px; }

    /* 台帳の基本設定パネル */
    .meta-toggle-btn {
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .meta-panel {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      border-top: none;
      box-shadow: var(--shadow-md);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .meta-panel.is-collapsed {
      display: none;
    }

    .input-field { display: flex; flex-direction: column; gap: 4px; }
    .input-field label { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px; }
    .input-field input, .input-field select {
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 13px;
      background-color: #f8fafc;
      color: var(--text-main);
      min-height: 38px;
      width: 100%;
    }

    /* 右サイドバー */
    .sidebar-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.4);
      z-index: 200; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .sidebar-overlay.is-active { opacity: 1; pointer-events: auto; }

    .sidebar-panel {
      position: fixed;
      top: 0; right: 0; width: 320px; max-width: 85vw; height: 100vh;
      background: #ffffff; z-index: 201;
      box-shadow: -4px 0 24px rgba(0,0,0,0.2);
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-panel.is-active { transform: translateX(0); }

    .sidebar-header {
      padding: 14px 16px; background: #0f172a; color: #fff;
      font-size: 14px; font-weight: 700; display: flex;
      justify-content: space-between; align-items: center;
    }
    .sidebar-close-btn { background: transparent; border: none; color: #94a3b8; font-size: 18px; cursor: pointer; padding: 4px 8px; }

    .sidebar-body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; flex: 1; }

    .quick-section { display: flex; flex-direction: column; gap: 6px; }
    .quick-section-label { font-size: 11px; font-weight: 700; color: #64748b; letter-spacing: 0.5px; text-transform: uppercase; }
    .quick-tags-group { display: flex; flex-wrap: wrap; gap: 6px; }

    .tag-chip {
      background-color: #f1f5f9; border: 1px solid #cbd5e1; color: #334155;
      padding: 7px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 4px; min-height: 34px;
    }
    .tag-chip.type-process { background-color: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .tag-chip.type-equipment { background-color: #faf5ff; color: #7e22ce; border-color: #e9d5ff; }
    .tag-chip.result-ok { background-color: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
    .tag-chip.result-ng { background-color: #fff1f2; color: #be123c; border-color: #fecdd3; }
    .tag-chip.type-custom { background-color: #fef3c7; color: #b45309; border-color: #fde68a; }
    .tag-chip.type-doctype { background-color: #e0f2fe; color: #0369a1; border-color: #bae6fd; }

    .tag-del-btn { font-size: 11px; color: #94a3b8; margin-left: 2px; }

    .add-tag-btn {
      background-color: #f8fafc; border: 1px dashed #94a3b8; color: #475569;
      padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
      cursor: pointer; min-height: 36px;
    }

    /* フローティングバー */
    .mobile-float-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 99;
      background: rgba(15, 23, 42, 0.95); padding: 10px 12px;
      border-top: 1px solid rgba(255,255,255,0.15);
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column; gap: 8px;
    }
    .mobile-float-bar.is-visible { transform: translateY(0); }
    .mobile-float-title { font-size: 11px; color: #94a3b8; font-weight: 700; display: flex; justify-content: space-between; }
    .mobile-float-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .mobile-float-chips .tag-chip { white-space: nowrap; flex-shrink: 0; }

    /* A4台帳シート (PC表示用) */
    .page {
      background: #fff;
      width: 210mm;
      height: 297mm;
      margin: 0 auto 30px auto;
      padding: 10mm;
      box-shadow: var(--shadow-lg);
      border-radius: 4px;
      position: relative;
      box-sizing: border-box;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .page-footer-actions {
      margin-top: 10px;
      padding-top: 8px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      width: 100%;
    }

    .page-header {
      border-bottom: 2px solid #0f172a;
      padding-bottom: 4px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-shrink: 0;
      height: 35px;
    }
    .page-title { font-size: 17px; font-weight: 800; color: #0f172a; }
    .page-meta { font-size: 10px; color: #475569; text-align: right; line-height: 1.3; }
    .page-number-text { font-size: 11px; font-weight: 700; color: #2563eb; }

    /* PC・大画面時のグリッド */
    .photo-grid {
      display: grid;
      gap: 16px;
      height: calc(100% - 35px);
      width: 100%;
      box-sizing: border-box;
    }
    
    .grid-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .grid-2 { grid-template-columns: 1fr; grid-template-rows: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: 1fr; grid-template-rows: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(2, 1fr); }
    .grid-6 { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); }
    .grid-8 { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); }

    .photo-card {
      border: none;
      border-radius: 0;
      padding: 2px;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }

    .photo-card.next-target {
      border: 2px solid #2563eb !important;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
      background-color: #eff6ff;
      border-radius: 4px;
    }

    .photo-box {
      width: 100%;
      flex: 1;
      min-height: 0;
      background: #f1f5f9;
      border: none;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      margin: 0 auto;
    }

    .grid-1 .photo-box { aspect-ratio: 4 / 3; max-height: 190mm; max-width: 220mm; }
    .grid-2 .photo-box { aspect-ratio: 4 / 3; max-height: 100mm; max-width: 135mm; }
    .grid-3 .photo-box { aspect-ratio: 4 / 3; max-height: 65mm; max-width: 90mm; }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
    .photo-controls { display: flex; gap: 6px; z-index: 2; width: 85%; max-width: 240px; }
    .photo-btn {
      background: #fff; border: 1px solid #cbd5e1; padding: 4px 8px;
      border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer;
      flex: 1; text-align: center; min-height: 32px; display: inline-flex;
      align-items: center; justify-content: center;
    }
    .photo-btn-highlight {
      background: #2563eb !important; color: #fff !important; border-color: #1d4ed8 !important;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    
    .photo-overlay-actions {
      position: absolute; top: 4px; right: 4px; left: 4px;
      display: none; gap: 4px; z-index: 3; justify-content: flex-end; flex-wrap: wrap;
    }
    .overlay-btn {
      background: rgba(15, 23, 42, 0.88); color: #fff; border: none;
      padding: 3px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; cursor: pointer;
    }
    .overlay-btn-save { background: rgba(5, 150, 105, 0.95); }
    .overlay-btn-del { background: rgba(225, 29, 72, 0.95); }
    .file-input { display: none; }

    .caption-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
      width: 100%;
      margin: 0 auto;
    }
    
    .caption-group input {
      width: 100%;
      padding: 4px 2px;
      font-size: 11px;
      border: none;
      border-bottom: 1px solid #cbd5e1;
      border-radius: 0;
      background: transparent;
      color: var(--text-main);
      box-sizing: border-box;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .caption-group input:focus {
      border-bottom-color: var(--primary);
      outline: none;
      background: #f8fafc;
    }

    .grid-1 .caption-group { max-width: 220mm; gap: 5px; }
    .grid-1 .caption-group input { font-size: 13px; padding: 6px 4px; }

    .grid-2 .caption-group { max-width: 135mm; gap: 4px; }
    .grid-2 .caption-group input { font-size: 12px; padding: 5px 3px; }

    .grid-3 .caption-group { max-width: 90mm; gap: 3px; }
    .grid-3 .caption-group input { font-size: 11px; padding: 4px 2px; }

    .save-status { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background-color: #94a3b8; }
    .status-dot.online { background-color: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }

    /* 📱 スマホ表示最適化 (幅768px以下) */
    @media screen and (max-width: 768px) {
      .nav-bar {
        padding: 8px;
        justify-content: space-between;
      }
      .nav-title {
        font-size: 13px;
        margin-right: 0;
      }
      .nav-buttons {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
      }
      .nav-buttons .btn {
        padding: 4px 2px;
        font-size: 10px;
        min-height: 34px;
      }
      .project-dropdown-wrapper { grid-column: span 1; position: relative; }

      /* スマホ時の物件ドロップダウン調整（画面からはみ出さず中央寄せ配置） */
      .project-menu-popup {
        position: fixed;
        top: 55px;
        left: 12px;
        right: 12px;
        width: auto;
        margin-top: 0;
        z-index: 250;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      }

      .page {
        width: 100% !important;
        height: auto !important;
        min-height: initial !important;
        padding: 12px !important;
        margin-bottom: 24px !important;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      }

      .photo-grid {
        display: flex !important;
        flex-direction: column !important;
        height: auto !important;
        gap: 20px !important;
      }

      .photo-card {
        height: auto !important;
        padding-bottom: 12px;
        border-bottom: 1px dashed var(--border-color);
      }
      .photo-card:last-child {
        border-bottom: none;
      }

      .photo-box {
        width: 100% !important;
        height: 220px !important;
        max-height: none !important;
        max-width: none !important;
      }

      .caption-group {
        max-width: 100% !important;
        gap: 6px !important;
      }

      .caption-group input {
        font-size: 14px !important;
        padding: 8px 4px !important;
      }
    }

    /* 🖨️ 印刷・PDF出力 */
    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html, body {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        -webkit-print-color-adjust: exact;
        overflow: visible !important;
      }
      .no-print, .nav-bar, .meta-panel, .meta-toggle-btn, .sidebar-overlay, .sidebar-panel, .save-status, .mobile-float-bar, .page-footer-actions {
        display: none !important;
      }
      .container {
        max-width: 100% !important;
        width: 210mm !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      
      .page {
        box-shadow: none !important;
        border: none !important;
        width: 210mm !important;
        height: 297mm !important;
        max-height: 297mm !important;
        padding: 10mm !important;
        margin: 0 !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        page-break-after: always !important;
        break-after: page !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
        display: flex !important;
        flex-direction: column !important;
      }

      .page-header {
        border-bottom: 2px solid #000 !important;
        height: 30px !important;
        margin-bottom: 8px !important;
      }

      .photo-grid {
        display: grid !important;
        gap: 12px !important;
        height: calc(297mm - 20mm - 38px) !important;
      }
      .grid-1 { grid-template-columns: 1fr !important; grid-template-rows: 1fr !important; }
      .grid-2 { grid-template-columns: 1fr !important; grid-template-rows: repeat(2, 1fr) !important; }
      .grid-3 { grid-template-columns: 1fr !important; grid-template-rows: repeat(3, 1fr) !important; }
      .grid-4 { grid-template-columns: 1fr 1fr !important; grid-template-rows: repeat(2, 1fr) !important; }
      .grid-6 { grid-template-columns: 1fr 1fr !important; grid-template-rows: repeat(3, 1fr) !important; }
      .grid-8 { grid-template-columns: 1fr 1fr !important; grid-template-rows: repeat(4, 1fr) !important; }

      .photo-card {
        padding: 0 !important;
        border: none !important;
        background: transparent !important;
        height: 100% !important;
      }

      .photo-controls, .photo-overlay-actions { display: none !important; }
      .photo-box {
        border: none !important;
        background: transparent !important;
        height: auto !important;
      }
      .photo-box img {
        object-fit: contain !important;
      }
      .caption-group input {
        border: none !important;
        border-bottom: 1px solid #94a3b8 !important;
        border-radius: 0 !important;
        background: transparent !important;
        font-size: 10px !important;
        padding: 1px 0 !important;
      }
      .photo-card.is-empty-card { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- 上部ナビゲーションバー -->
  <div class="nav-bar no-print">
    <div class="nav-title">📷 <span>写真台帳 Pro</span></div>
    <div class="nav-buttons">
      <div class="project-dropdown-wrapper">
        <button class="btn btn-sky" onclick="toggleProjectMenu(event)">📁 物件 ▾</button>
        <div class="project-menu-popup" id="projectMenuPopup">
          <label>切り替え対象を選択:</label>
          <select id="projectSelect" onchange="switchProject(this.value)"></select>
          <div class="project-menu-actions">
            <button class="btn" onclick="renameCurrentProject()">✏️ 名称を変更</button>
            <button class="btn btn-indigo" onclick="createNewProject()">＋ 新規物件を追加</button>
            <button class="btn btn-rose" onclick="deleteCurrentProject()">🗑 この物件を削除</button>
          </div>
        </div>
      </div>

      <button class="btn btn-sky" onclick="toggleSidebar()">⚡ 定型文</button>
      <button class="btn" id="btnContinuousMode" onclick="toggleContinuousMode()">📷 連続 OFF</button>
      <button class="btn" onclick="addPage()">＋ ページ追加</button>
      <button class="btn btn-indigo" onclick="exportDataFile()">📤 出力</button>
      <button class="btn btn-indigo" onclick="triggerImportFile()">📥 読込</button>
      <input type="file" id="importFileInput" accept=".json,.txt" style="display:none;" onchange="importDataFile(event)">
      <button class="btn btn-amber" onclick="clearCurrentProjectData()">🗑 リセット</button>
      <button class="btn btn-emerald" onclick="doPrint()">🖨️ PDF・印刷</button>
    </div>
  </div>

  <div class="container">
    <!-- 基本設定トグル -->
    <button class="meta-toggle-btn no-print" onclick="toggleMetaPanel()">
      <span>⚙️ 台帳の基本設定（物件名・配置枚数など）</span>
      <span id="metaToggleIcon">▲</span>
    </button>

    <!-- 基本設定パネル（デフォルト表示） -->
    <div class="meta-panel no-print" id="metaPanel">
      <div class="input-field">
        <label>台帳の種類（表題）</label>
        <select id="docType" onchange="updateDocTitle()">
          <optgroup label="★ マイ表題（自作）" id="customDocTypeGroup"></optgroup>
          <optgroup label="基本表題">

  <div class="mobile-float-bar no-print" id="mobileFloatBar">

      <span id="floatBarCategory">⚡ 定型文をタップして挿入</span>
      <span style="cursor: pointer; padding: 2px 8px;" onclick="hideFloatBar()">✕ 閉じる</span>
    </div>
    <div class="mobile-float-chips" id="mobileFloatChips"></div>
  </div>

  <script>
    let pageCount = 0;
    let activeInput = null;
    let customTags = [];
    let customDocTypes = [];
    let isContinuousMode = false;
    let saveTimeout = null;
    
    let projectsList = [];
    let currentProjectId = 'proj_default';

    window.onload = function() {
      document.addEventListener('focusin', (e) => {
        if (e.target.tagName === 'INPUT' && e.target.type === 'text') {
          activeInput = e.target;
          showFloatBarForInput(e.target);
        }
      });

      document.addEventListener('click', (e) => {
        const popup = document.getElementById('projectMenuPopup');
        const wrapper = e.target.closest('.project-dropdown-wrapper');
        if (!wrapper && popup.classList.contains('is-open')) {
          popup.classList.remove('is-open');
        }
      });

      loadCustomDocTypes();
      loadCustomTags();
      initProjectsList();
    };

    function toggleMetaPanel() {
      const panel = document.getElementById('metaPanel');
      const icon = document.getElementById('metaToggleIcon');
      if (panel.classList.contains('is-collapsed')) {
        panel.classList.remove('is-collapsed');
        icon.textContent = '▲';
      } else {
        panel.classList.add('is-collapsed');
        icon.textContent = '▼';
      }
    }

    function debouncedSaveData() {
      document.getElementById('saveStatusText').textContent = '編集中...';
      if (saveTimeout) clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        saveData();
      }, 800);
    }

    function toggleContinuousMode() {
      isContinuousMode = !isContinuousMode;
      const btn = document.getElementById('btnContinuousMode');
      if (isContinuousMode) {
        btn.textContent = '📷 連続 ON';
        btn.classList.add('btn-toggle-active');
      } else {
        btn.textContent = '📷 連続 OFF';
        btn.classList.remove('btn-toggle-active');
        clearHighlights();
      }
    }

    function clearHighlights() {
      document.querySelectorAll('.photo-card').forEach(el => el.classList.remove('next-target'));
      document.querySelectorAll('.photo-btn').forEach(el => el.classList.remove('photo-btn-highlight'));
    }

    function toggleProjectMenu(event) {
      event.stopPropagation();
      document.getElementById('projectMenuPopup').classList.toggle('is-open');
    }

    function toggleSidebar() {
      document.getElementById('sidebarOverlay').classList.toggle('is-active');
      document.getElementById('sidebarPanel').classList.toggle('is-active');
    }

    function initProjectsList() {
      const rawList = localStorage.getItem('fire_projects_list');
      if (rawList) { try { projectsList = JSON.parse(rawList); } catch(e) { projectsList = []; } }

      if (projectsList.length === 0) {
        currentProjectId = 'proj_' + Date.now();
        projectsList.push({ id: currentProjectId, name: '新規物件 1' });
        saveProjectsList();
      } else {
        currentProjectId = localStorage.getItem('fire_current_project_id') || projectsList[0].id;
      }

      renderProjectSelect();
      loadDataForCurrentProject();
    }

    function saveProjectsList() {
      localStorage.setItem('fire_projects_list', JSON.stringify(projectsList));
      localStorage.setItem('fire_current_project_id', currentProjectId);
    }

    function renderProjectSelect() {
      const select = document.getElementById('projectSelect');
      select.innerHTML = '';
      projectsList.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name || '無題の物件';
        if (p.id === currentProjectId) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function createNewProject() {
      saveData();
      const newId = 'proj_' + Date.now();
      const defaultName = `新規物件 ${projectsList.length + 1}`;
      projectsList.push({ id: newId, name: defaultName });
      currentProjectId = newId;
      saveProjectsList();
      renderProjectSelect();

      document.getElementById('pagesContainer').innerHTML = '';
      document.getElementById('buildingName').value = '';
      document.getElementById('inspectDate').value = '';
      document.getElementById('inspector').value = '';
      pageCount = 0;
      addPage();
      updateHeader();
      saveData();

      document.getElementById('projectMenuPopup').classList.remove('is-open');
    }

    function renameCurrentProject() {
      const cur = projectsList.find(p => p.id === currentProjectId);
      if (!cur) return;
      const newName = prompt('物件の名称を変更してください:', cur.name);
      if (newName && newName.trim() !== '') {
        cur.name = newName.trim();
        document.getElementById('buildingName').value = cur.name;
        saveProjectsList();
        renderProjectSelect();
        updateHeader();
        saveData();
      }
      document.getElementById('projectMenuPopup').classList.remove('is-open');
    }

    function deleteCurrentProject() {
      if (projectsList.length <= 1) { alert('作業物件が1件しかないため削除できません。'); return; }

      const cur = projectsList.find(p => p.id === currentProjectId);
      const nameStr = cur ? cur.name : 'この物件';

      if (confirm(`「${nameStr}」を削除しますか？`)) {
        localStorage.removeItem('fire_data_' + currentProjectId);
        projectsList = projectsList.filter(p => p.id !== currentProjectId);
        currentProjectId = projectsList[0].id;

        saveProjectsList();
        renderProjectSelect();
        loadDataForCurrentProject();
      }
      document.getElementById('projectMenuPopup').classList.remove('is-open');
    }

    function switchProject(targetId) {
      if (targetId === currentProjectId) return;
      saveData();
      currentProjectId = targetId;
      saveProjectsList();
      loadDataForCurrentProject();
      document.getElementById('projectMenuPopup').classList.remove('is-open');
    }

    function updateProjectNameInSelect() {
      const name = document.getElementById('buildingName').value.trim() || '無題の物件';
      const cur = projectsList.find(p => p.id === currentProjectId);
      if (cur) {
        cur.name = name;
        saveProjectsList();
        renderProjectSelect();
      }
    }

    function clearCurrentProjectData() {
      if (confirm('現在の表示・データをすべて初期化しますか？')) {
        localStorage.removeItem('fire_data_' + currentProjectId);
        document.getElementById('pagesContainer').innerHTML = '';
        document.getElementById('buildingName').value = '';
        document.getElementById('inspectDate').value = '';
        document.getElementById('inspector').value = '';
        pageCount = 0;
        addPage();
        updateHeader();
        updateProjectNameInSelect();
        saveData();
        clearHighlights();
      }
    }

    function loadDataForCurrentProject() {
      document.getElementById('pagesContainer').innerHTML = '';
      pageCount = 0;
      const raw = localStorage.getItem('fire_data_' + currentProjectId);

      if (!raw) {
        addPage();
        updateHeader();
        return;
      }

      try {
        const data = JSON.parse(raw);
        const targetPages = data.pageCount || 1;
        for (let p = 1; p <= targetPages; p++) {
          pageCount++;
          renderPageHtml(pageCount);
        }
        setTimeout(() => { restoreCardsAndMeta(data); }, 50);
      } catch (e) {
        addPage();
        updateHeader();
      }
    }

    function loadCustomDocTypes() {
      const raw = localStorage.getItem('fire_report_custom_doctypes');
      if (raw) { try { customDocTypes = JSON.parse(raw); } catch (e) { customDocTypes = []; } }
      renderCustomDocTypes();
    }

    function renderCustomDocTypes() {
      const group = document.getElementById('customDocTypeGroup');
      group.innerHTML = '';
      if (customDocTypes.length === 0) { group.style.display = 'none'; }
      else {
        group.style.display = 'block';
        customDocTypes.forEach(title => {
          const opt = document.createElement('option');
          opt.value = title; opt.textContent = title;
          group.appendChild(opt);
        });
      }

      const container = document.getElementById('customDocTypesContainer');
      container.innerHTML = '';
      customDocTypes.forEach((docTitle, idx) => {
        const chip = document.createElement('span');
        chip.className = 'tag-chip type-doctype';
        chip.innerHTML = `${docTitle} <span class="tag-del-btn" onclick="deleteCustomDocType(event, ${idx})">✕</span>`;
        chip.onclick = function(e) {
          if (!e.target.classList.contains('tag-del-btn')) {
            document.getElementById('docType').value = docTitle;
            updateDocTitle(); saveData();
            toggleSidebar();
          }
        };
        container.appendChild(chip);
      });
    }

    function addNewCustomDocType() {
      const text = prompt('追加したい「台帳の種類（表題）」を入力してください:');
      if (text && text.trim() !== '') {
        const newTitle = text.trim();
        if (!customDocTypes.includes(newTitle)) {
          customDocTypes.push(newTitle);
          localStorage.setItem('fire_report_custom_doctypes', JSON.stringify(customDocTypes));
          renderCustomDocTypes();
        }
        document.getElementById('docType').value = newTitle;
        updateDocTitle(); saveData();
      }
    }

    function deleteCustomDocType(e, idx) {
      e.stopPropagation();
      if (confirm(`マイ表題「${customDocTypes[idx]}」を削除しますか？`)) {
        customDocTypes.splice(idx, 1);
        localStorage.setItem('fire_report_custom_doctypes', JSON.stringify(customDocTypes));
        renderCustomDocTypes(); updateDocTitle(); saveData();
      }
    }

    async function exportDataFile() {
      saveData();
      const raw = localStorage.getItem('fire_data_' + currentProjectId);
      if (!raw) { alert('保存するデータがありません。'); return; }

      const bName = document.getElementById('buildingName').value || '写真台帳';
      const defaultFileName = `${bName}_${new Date().toISOString().split('T')[0]}.json`;

      let fileName = prompt('保存するファイル名を入力してください:', defaultFileName);
      if (!fileName) return;
      if (!fileName.endsWith('.json') && !fileName.endsWith('.txt')) fileName += '.json';

      const blob = new Blob([raw], { type: 'application/json;charset=utf-8' });

      if ('showSaveFilePicker' in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: fileName,
            types: [{ description: 'JSON データファイル', accept: { 'application/json': ['.json'] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob); await writable.close();
          return;
        } catch (err) { if (err.name === 'AbortError') return; }
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    function triggerImportFile() { document.getElementById('importFileInput').click(); }

    function importDataFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const jsonText = e.target.result;
          JSON.parse(jsonText);
          localStorage.setItem('fire_data_' + currentProjectId, jsonText);
          alert('物件データを正常に読み込みました！');
          loadDataForCurrentProject();
        } catch (err) { alert('ファイルの読み込みに失敗しました。'); }
      };
      reader.readAsText(file);
    }

    function showFloatBarForInput(inputEl) {
      const floatBar = document.getElementById('mobileFloatBar');
      const chipsContainer = document.getElementById('mobileFloatChips');
      const titleEl = document.getElementById('floatBarCategory');

      if (!inputEl.id || !inputEl.id.includes('-c') || inputEl.id.startsWith('t2-')) {
        hideFloatBar(); return;
      }

      let tags = []; let categoryName = '';
      if (inputEl.id.startsWith('t1-')) {
        categoryName = '【① 工程】 タップで即時置換';
        tags = [
          { text: '施工前', class: 'type-process' }, { text: '施工中', class: 'type-process' },
          { text: '施工後', class: 'type-process' }, { text: '取替前', class: 'type-process' },
          { text: '取替中', class: 'type-process' }, { text: '取替後', class: 'type-process' },
          { text: '納入機器', class: 'type-process' }, { text: '撤去機器', class: 'type-process' }, { text: '試験状況', class: 'type-process' }
        ];
      } else if (inputEl.id.startsWith('t3-')) {
        categoryName = '【③ 内容・結果】 タップで文字追加';
        tags = [
          { text: '【良好】', class: 'result-ok' }, { text: '作動確認済', class: 'result-ok' },
          { text: '【良】 新品交換完了', class: 'result-ok' }, { text: '【不良】 経年劣化', class: 'result-ng' },
          { text: '【要修繕】 機器障害', class: 'result-ng' }, { text: '【要交換】 期限切れ', class: 'result-ng' }
        ];
      }

      customTags.forEach(ct => tags.push({ text: ct, class: 'type-custom' }));

      titleEl.textContent = categoryName;
      chipsContainer.innerHTML = '';
      tags.forEach(t => {
        const chip = document.createElement('span');
        chip.className = `tag-chip ${t.class}`;
        chip.textContent = t.text;
        chip.onmousedown = function(e) { e.preventDefault(); insertTag(t.text); };
        chipsContainer.appendChild(chip);
      });
      floatBar.classList.add('is-visible');
    }

    function hideFloatBar() { document.getElementById('mobileFloatBar').classList.remove('is-visible'); }

    function loadCustomTags() {
      const raw = localStorage.getItem('fire_report_custom_tags');
      if (raw) { try { customTags = JSON.parse(raw); } catch (e) { customTags = []; } }
      renderCustomTags();
    }

    function renderCustomTags() {
      const container = document.getElementById('customTagsContainer');
      container.innerHTML = '';
      customTags.forEach((tagText, idx) => {
        const chip = document.createElement('span');
        chip.className = 'tag-chip type-custom';
        chip.innerHTML = `${tagText} <span class="tag-del-btn" onclick="deleteCustomTag(event, ${idx})">✕</span>`;
        chip.onclick = function(e) { if (!e.target.classList.contains('tag-del-btn')) insertTag(tagText); };
        container.appendChild(chip);
      });
    }

    function addNewCustomTag() {
      const text = prompt('追加したいオリジナルの定型文を入力してください:');
      if (text && text.trim() !== '') {
        customTags.push(text.trim());
        localStorage.setItem('fire_report_custom_tags', JSON.stringify(customTags));
        renderCustomTags();
      }
    }

    function deleteCustomTag(e, idx) {
      e.stopPropagation();
      if (confirm(`定型文「${customTags[idx]}」を削除しますか？`)) {
        customTags.splice(idx, 1);
        localStorage.setItem('fire_report_custom_tags', JSON.stringify(customTags));
        renderCustomTags();
      }
    }

    function insertTag(text) {
      if (activeInput) {
        if (activeInput.id && activeInput.id.startsWith('t1-')) activeInput.value = text;
        else activeInput.value = activeInput.value ? `${activeInput.value} ${text}` : text;
        debouncedSaveData();
      } else { alert('テキスト入力欄を選択してから定型文をタップしてください。'); }
    }

    window.addEventListener('beforeprint', preparePrint);
    window.addEventListener('afterprint', restorePrint);

    function preparePrint() {
      hideFloatBar();
      document.querySelectorAll('input[placeholder]').forEach(input => {
        if (input.placeholder !== '') { input.dataset.tempPlaceholder = input.placeholder; input.placeholder = ''; }
      });
      document.querySelectorAll('.photo-card').forEach(card => {
        const img = card.querySelector('img');
        const inputs = card.querySelectorAll('.caption-group input');
        const rawSrc = img ? (img.getAttribute('src') || '') : '';
        const hasImg = rawSrc.length > 0 && img.style.display !== 'none';
        const hasText = Array.from(inputs).some(input => (input.value ? input.value.trim() : '').length > 0);
        if (!hasImg && !hasText) card.classList.add('is-empty-card');
        else card.classList.remove('is-empty-card');
      });
    }

    function restorePrint() {
      document.querySelectorAll('input[data-temp-placeholder]').forEach(input => {
        input.placeholder = input.dataset.tempPlaceholder; delete input.dataset.tempPlaceholder;
      });
      document.querySelectorAll('.photo-card.is-empty-card').forEach(card => card.classList.remove('is-empty-card'));
    }

    function doPrint() { window.print(); }

    function getCardCountForMode(mode) {
      const match = mode.match(/grid-(\d+)/);
      return match ? parseInt(match[1], 10) : 6;
    }

    function updateDocTitle() {
      const docType = document.getElementById('docType').value;
      document.querySelectorAll('.page-title').forEach(el => { el.textContent = docType; });
      debouncedSaveData();
    }

    function updateHeader() {
      const bName = document.getElementById('buildingName').value || '（未入力）';
      const dVal = document.getElementById('inspectDate').value;
      const dateStr = dVal ? `作業日: ${dVal.replace(/-/g, '/')}` : '';
      const inspector = document.getElementById('inspector').value;
      const inspectorStr = inspector ? `担当: ${inspector}` : '';
      const subLineStr = [dateStr, inspectorStr].filter(Boolean).join(' ');

      document.querySelectorAll('.display-building').forEach(el => el.textContent = bName);
      document.querySelectorAll('.display-sub-line').forEach(el => {
        el.textContent = subLineStr; el.style.display = subLineStr ? 'block' : 'none';
      });
    }

    function updatePageNumbers() {
      const pages = document.querySelectorAll('.page');
      const total = pages.length;
      pages.forEach((pageEl, index) => {
        const pageNumEl = pageEl.querySelector('.display-page-num');
        if (pageNumEl) pageNumEl.textContent = `${index + 1} / ${total} ページ`;
      });
    }

    function changeLayoutMode() { saveData(); rebuildAllPages(); }

    function addPage() {
      pageCount++; renderPageHtml(pageCount); updateHeader(); updatePageNumbers(); debouncedSaveData();
    }

    function renderPageHtml(pNum) {
      const mode = document.getElementById('layoutMode').value;
      const maxCards = getCardCountForMode(mode);
      const docType = document.getElementById('docType').value;
      const pagesContainer = document.getElementById('pagesContainer');

      const page = document.createElement('div');
      page.className = 'page'; page.id = `page-${pNum}`;

      let cardsHtml = '';
      for (let i = 1; i <= maxCards; i++) {
        const cardId = `p${pNum}-c${i}`;
        cardsHtml += `
          <div class="photo-card" id="card-${cardId}">
            <div class="photo-box" id="box-${cardId}">
              <img id="img-${cardId}" src="" alt="写真" data-rotate="0" data-scale="1">
              <div class="photo-overlay-actions" id="overlay-${cardId}">
                <button class="overlay-btn overlay-btn-save" onclick="downloadPhoto('${cardId}')">💾</button>
                <button class="overlay-btn" onclick="zoomPhoto('${cardId}', 0.1)">➕</button>
                <button class="overlay-btn" onclick="zoomPhoto('${cardId}', -0.1)">➖</button>
                <button class="overlay-btn" onclick="rotatePhoto('${cardId}')">↺ 回転</button>
                <button class="overlay-btn overlay-btn-del" onclick="clearPhoto('${cardId}')">✕</button>
              </div>
              <div class="photo-controls" id="btn-group-${cardId}">
                <button class="photo-btn" id="btn-cam-${cardId}" onclick="triggerFile('${cardId}', true)">📷 撮影</button>
                <button class="photo-btn" id="btn-lib-${cardId}" onclick="triggerFile('${cardId}', false)">🖼️ 選択</button>
              </div>
              <input type="file" id="input-cam-${cardId}" class="file-input" accept="image/*" capture="environment" onchange="handleFileSelect(event, '${cardId}')">
              <input type="file" id="input-lib-${cardId}" class="file-input" accept="image/*" onchange="handleFileSelect(event, '${cardId}')">
            </div>
            <div class="caption-group">
              <input type="text" id="t1-${cardId}" placeholder="① 工程 (例: 施工前)" oninput="debouncedSaveData()">
              <input type="text" id="t2-${cardId}" placeholder="② 設置場所 (例: 1階 エントランス)" oninput="debouncedSaveData()">
              <input type="text" id="t3-${cardId}" placeholder="③ 内容・結果 (例: 10型粉末 良好)" oninput="debouncedSaveData()">
            </div>
          </div>
        `;
      }

      page.innerHTML = `
        <div class="page-header">
          <div class="page-title">${docType}</div>
          <div class="page-meta">
            <div>物件名: <span class="display-building"></span></div>
            <div class="display-sub-line"></div>
            <div class="page-number-text display-page-num"></div>
          </div>
        </div>
        <div class="photo-grid ${mode}">${cardsHtml}</div>
        ${pNum > 1 ? `
          <div class="page-footer-actions no-print">
            <button class="btn btn-rose" onclick="removePage('page-${pNum}')">このページを削除</button>
          </div>
        ` : ''}
      `;
      pagesContainer.appendChild(page);
    }

    function removePage(pageId) {
      if (confirm('このページを削除してもよろしいですか？')) {
        document.getElementById(pageId).remove();
        pageCount--; updatePageNumbers(); saveData();
      }
    }

    function triggerFile(cardId, isCamera) {
      const inputId = isCamera ? `input-cam-${cardId}` : `input-lib-${cardId}`;
      const inputEl = document.getElementById(inputId);
      inputEl.value = ''; inputEl.click();
    }

    function handleFileSelect(event, cardId) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 1280;
          let width = img.width; let height = img.height;

          if (width > height) {
            if (width > maxDim) { height *= maxDim / width; width = maxDim; }
          } else {
            if (height > maxDim) { width *= maxDim / height; height = maxDim; }
          }

          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.65);
          setPhotoData(cardId, compressedDataUrl, 0, 1);
          saveData();

          if (isContinuousMode) {
            highlightNextPhotoSlot(cardId);
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function highlightNextPhotoSlot(currentCardId) {
      clearHighlights();
      const allCards = Array.from(document.querySelectorAll('.photo-card'));
      const currentIndex = allCards.findIndex(c => c.id === `card-${currentCardId}`);
      
      if (currentIndex !== -1 && currentIndex < allCards.length - 1) {
        const nextCard = allCards[currentIndex + 1];
        const nextCardId = nextCard.id.replace('card-', '');
        
        nextCard.classList.add('next-target');
        nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        const targetBtn = document.getElementById(`btn-cam-${nextCardId}`);
        if (targetBtn) {
          targetBtn.classList.add('photo-btn-highlight');
        }
      }
    }

    function setPhotoData(cardId, srcUrl, deg = 0, scale = 1) {
      const imgEl = document.getElementById(`img-${cardId}`);
      const btnGroup = document.getElementById(`btn-group-${cardId}`);
      const overlay = document.getElementById(`overlay-${cardId}`);
      if (!imgEl) return;

      imgEl.src = srcUrl; imgEl.style.display = 'block';
      imgEl.setAttribute('data-rotate', deg);
      imgEl.setAttribute('data-scale', scale);
      applyImageTransform(imgEl, deg, scale);
      btnGroup.style.display = 'none'; overlay.style.display = 'flex';
    }

    function applyImageTransform(imgEl, deg, scale) {
      let baseScale = scale;
      if (deg === 90 || deg === 270) baseScale *= 0.75;
      imgEl.style.transform = `rotate(${deg}deg) scale(${baseScale})`;
    }

    function zoomPhoto(cardId, delta) {
      const imgEl = document.getElementById(`img-${cardId}`);
      let scale = parseFloat(imgEl.getAttribute('data-scale') || '1');
      let deg = parseInt(imgEl.getAttribute('data-rotate') || '0', 10);
      scale = Math.max(0.5, Math.min(2.5, scale + delta));
      imgEl.setAttribute('data-scale', scale);
      applyImageTransform(imgEl, deg, scale);
      debouncedSaveData();
    }

    function downloadPhoto(cardId) {
      const imgEl = document.getElementById(`img-${cardId}`);
      if (!imgEl || !imgEl.src) return;
      const a = document.createElement('a'); a.href = imgEl.src;
      a.download = `photo_${cardId}_${Date.now()}.jpg`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    function rotatePhoto(cardId) {
      const imgEl = document.getElementById(`img-${cardId}`);
      let deg = parseInt(imgEl.getAttribute('data-rotate') || '0', 10);
      let scale = parseFloat(imgEl.getAttribute('data-scale') || '1');
      deg = (deg + 90) % 360;
      imgEl.setAttribute('data-rotate', deg);
      applyImageTransform(imgEl, deg, scale);
      debouncedSaveData();
    }

    function clearPhoto(cardId) {
      const imgEl = document.getElementById(`img-${cardId}`);
      const btnGroup = document.getElementById(`btn-group-${cardId}`);
      const overlay = document.getElementById(`overlay-${cardId}`);

      imgEl.removeAttribute('src'); imgEl.style.display = 'none';
      imgEl.setAttribute('data-rotate', '0'); imgEl.setAttribute('data-scale', '1');
      imgEl.style.transform = 'rotate(0deg) scale(1)';
      btnGroup.style.display = 'flex'; overlay.style.display = 'none';
      document.getElementById(`input-cam-${cardId}`).value = '';
      document.getElementById(`input-lib-${cardId}`).value = '';
      saveData();
    }

    function saveData() {
      const data = getFullDataObject();
      try {
        localStorage.setItem('fire_data_' + currentProjectId, JSON.stringify(data));
        document.getElementById('saveStatusText').textContent = '自動保存完了 (' + new Date().toLocaleTimeString() + ')';
      } catch (e) { console.warn('LocalStorage limit reached', e); }
    }

    function getFullDataObject() {
      const data = {
        docType: document.getElementById('docType').value,
        buildingName: document.getElementById('buildingName').value,
        inspectDate: document.getElementById('inspectDate').value,
        inspector: document.getElementById('inspector').value,
        layoutMode: document.getElementById('layoutMode').value,
        pageCount: pageCount,
        cards: {}
      };

      const maxCards = getCardCountForMode(data.layoutMode);
      for (let p = 1; p <= pageCount; p++) {
        for (let c = 1; c <= maxCards; c++) {
          const cardId = `p${p}-c${c}`;
          const imgEl = document.getElementById(`img-${cardId}`);
          if (imgEl) {
            data.cards[cardId] = {
              imgSrc: imgEl.style.display !== 'none' && imgEl.src.startsWith('data:') ? imgEl.src : '',
              rotate: imgEl.getAttribute('data-rotate') || '0',
              scale: imgEl.getAttribute('data-scale') || '1',
              t1: document.getElementById(`t1-${cardId}`)?.value || '',
              t2: document.getElementById(`t2-${cardId}`)?.value || '',
              t3: document.getElementById(`t3-${cardId}`)?.value || ''
            };
          }
        }
      }
      return data;
    }

    function rebuildAllPages() {
      const raw = localStorage.getItem('fire_data_' + currentProjectId);
      if (!raw) return;
      const data = JSON.parse(raw);
      document.getElementById('pagesContainer').innerHTML = '';
      const currentPages = data.pageCount || 1;
      pageCount = 0;
      for (let p = 1; p <= currentPages; p++) {
        pageCount++; renderPageHtml(pageCount);
      }
      restoreCardsAndMeta(data);
    }

    function restoreCardsAndMeta(data) {
      if (!data) return;

      if (data.docType) document.getElementById('docType').value = data.docType;
      if (data.buildingName) document.getElementById('buildingName').value = data.buildingName;
      if (data.inspectDate) document.getElementById('inspectDate').value = data.inspectDate;
      if (data.inspector) document.getElementById('inspector').value = data.inspector;
      if (data.layoutMode) document.getElementById('layoutMode').value = data.layoutMode;

      if (data.cards) {
        Object.keys(data.cards).forEach(cardId => {
          const item = data.cards[cardId];
          if (item.imgSrc) {
            setPhotoData(cardId, item.imgSrc, parseInt(item.rotate || '0', 10), parseFloat(item.scale || '1'));
          }
          if (document.getElementById(`t1-${cardId}`)) document.getElementById(`t1-${cardId}`).value = item.t1;
          if (document.getElementById(`t2-${cardId}`)) document.getElementById(`t2-${cardId}`).value = item.t2;
          if (document.getElementById(`t3-${cardId}`)) document.getElementById(`t3-${cardId}`).value = item.t3;
        });
      }

      updateHeader(); updatePageNumbers(); updateDocTitle();
    }
  </script>
</body>
</html>
